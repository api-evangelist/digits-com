name: Digits
kind: company
description: Digits is an AI-native accounting and bookkeeping platform for startups and their accountants,
  built around the Autonomous General Ledger (AGL) that auto-books the majority of transactions in real
  time. The Digits Connect API opens the AGL programmatically over REST with OAuth 2.0, letting partners
  send raw transaction, party, and dimension data for AI categorization and vendor enrichment, and read
  back ledger entries and financial statements. Digits also publishes an MCP server for AI agents (ChatGPT,
  Claude) to query the ledger.
